services:
  - type: web
    name: nexus-dfe-micro-api-v2
    runtime: node
    rootDir: base44/shared/dfe-micro-api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /live
    autoDeployTrigger: commit
    envVars:
      - key: DFE_API_TOKEN
        sync: false
      - key: CNPJ_NEURALTEC
        sync: false
      - key: CERT_PFX_BASE64
        sync: false
      - key: CERT_PFX_PASSWORD
        sync: false